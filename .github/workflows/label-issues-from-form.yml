name: Label Issues From Form

# Issue forms can only apply fixed labels. This applies labels based on the
# options selected in the "API" dropdown of the issue templates.

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label_issue:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add API labels
      uses: actions/github-script@v7
      with:
        script: |
          const labelIssue = require('./.github/scripts/label-issues-from-form.js');
          await labelIssue({ github, context });
